[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mousemover"
version = "0.1.0"
description = "Cross-platform mouse movement utility with CLI, GUI and movement plugins."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyautogui>=0.9.54",
    "pynput>=1.7.7",
    "screeninfo>=0.8.1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
mousemover = "mousemover.cli:main"
mousemover-gui = "mousemover.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
